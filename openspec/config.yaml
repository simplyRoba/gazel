schema: spec-driven

context: |
  Rust single-crate HTTP service with an embedded SvelteKit frontend for tracking personal
  fuel expenses, mileage, and efficiency. The application ships as a minimal Docker image.

rules:
  design:
    - "Favor simplicity and avoid unnecessary dependencies to preserve the minimal Docker image."
  specs:
    - "Use flat domain-prefixed capability directories at `specs/{domain}-{capability}/spec.md`. Supported domains are `core`, `api`, and `ui`; do not nest capability directories."
  tasks:
    - "Include a final task to run `cargo fmt -- --check`, `cargo clippy -- -D warnings`, `npm run format:check --prefix ui`, `npm run lint --prefix ui`, `npm run check --prefix ui`, and `cargo test` before archiving."
